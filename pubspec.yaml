name: edge_ai_app
description: "Edge AI - Face & Expression Analyzer with Google ML Kit"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Image picker - access gallery only
  image_picker: ^1.0.7

  # Google ML Kit - Face Detection (Edge Computing AI)
  google_mlkit_face_detection: ^0.11.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true